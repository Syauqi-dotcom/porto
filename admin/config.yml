backend:
  name: github
  repo: Syauqi-dotcom/porto
  branch: main

local_backend: true

media_folder: "public/projects"
public_folder: "/porto/projects"

collections:
  - name: "profile"
    label: "Global Settings"
    delete: false
    editor:
      preview: false
    files:
      - label: "Profile Content"
        name: "profile"
        file: "src/content/profile.json"
        fields:
          - {label: "Site Name (Logo Text)", name: "siteName", widget: "string"}
          - {label: "Author Name", name: "authorName", widget: "string"}
          - {label: "Author Role", name: "authorRole", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Description (Hero)", name: "description", widget: "text"}
          - label: "── Hero Section ──"
            name: "heroLabel"
            widget: "string"
            hint: "Small label above hero greeting (e.g. Portfolio)"
          - {label: "Hero Greeting", name: "heroGreeting", widget: "string", hint: "Text before the typewriter name (e.g. Hi! I'm,)"}
          - {label: "Hero Typewriter Name", name: "heroTypewriterName", widget: "string", hint: "The animated name in the hero (e.g. Syauqi.)"}
          - {label: "Hero Photo", name: "heroPhoto", widget: "image", hint: "Front photo for the hero card"}
          - {label: "Hero Back Photo", name: "heroBackPhoto", widget: "image", required: false, hint: "Back photo for the flip card (optional)"}
          - {label: "Hero CTA Label", name: "heroCTALabel", widget: "string", default: "View Profile", hint: "Primary button text"}
          - {label: "Hero CV Label", name: "heroCVLabel", widget: "string", default: "CV", hint: "Secondary button text"}
          - {label: "Hero CV File (Upload PDF)", name: "heroCVLink", widget: "file", default: "/porto/CV.pdf", hint: "Upload your latest CV/Resume PDF file here"}
          - label: "── About Section ──"
            name: "aboutBio"
            widget: "text"
            hint: "Main bio paragraph in the About section"
          - {label: "About Sub-Bio", name: "aboutSubBio", widget: "text", hint: "Secondary description below the main bio"}
          - label: "About Highlight Words"
            name: "aboutHighlights"
            widget: "list"
            hint: "Words that will be highlighted in accent color in the bio (e.g. quantum computing, generative AI)"
          - {label: "About University", name: "aboutUniversity", widget: "string", hint: "University name displayed in italic"}
          - label: "Social Links"
            name: "socials"
            widget: "object"
            fields:
              - {label: "GitHub", name: "github", widget: "string"}
              - {label: "LinkedIn", name: "linkedin", widget: "string"}
              - {label: "Twitter", name: "twitter", widget: "string", required: false}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}
              - {label: "WhatsApp", name: "whatsapp", widget: "string", required: false}

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Year", name: "date", widget: "string"}
      - {label: "Category", name: "category", widget: "string", required: false, hint: "e.g. Quantum, AI, Research, Web"}
      - {label: "Credit", name: "credit", widget: "string"}
      - {label: "Link URL", name: "link", widget: "string"}
      - {label: "Preview Image", name: "preview", widget: "image"}
      - {label: "Overview", name: "overview", widget: "text"}
      - {label: "Technology Development", name: "development", widget: "text", required: false}
      - {label: "Result", name: "result", widget: "text", required: false}
      - {label: "☆ Show on Homepage", name: "selected", widget: "boolean", default: true, hint: "Check to feature this project in the homepage Selected Work scroll"}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - label: "Collaborators (Logo List)"
        name: "collaborators"
        widget: "list"
        required: false
        field: {label: "Logo Image", name: "logo", widget: "image"}
          
  - name: "experience"
    label: "Experience"
    folder: "src/content/experience"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    sortable_fields: ["period", "title"]
    fields:
      - {label: "Title (Organization)", name: "title", widget: "string", hint: "e.g. Badan Riset dan Inovasi Nasional (BRIN)"}
      - {label: "Period", name: "period", widget: "string", hint: "e.g. 2026, 2025 (odd sem)"}
      - {label: "Role", name: "role", widget: "string", hint: "e.g. Research Intern — Pusat Riset Fisika Kuantum"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Logo", name: "logo", widget: "image", required: false}

  - name: "notebook"
    label: "Research Notes"
    folder: "src/content/notebook"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false}
      - {label: "Tag", name: "tag", widget: "string"}
      - {label: "Snippet", name: "snippet", widget: "text"}
      - {label: "More Explanation", name: "explanation", widget: "text", required: false}

